version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
  settings:
    misspell:
      ignore-rules:
        - operacional
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofmt
    - goimports
