<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Primary Brand Gradient (Cyan to Indigo) -->
    <linearGradient id="brandCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Pulse Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Outer Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Radar / Crossplane Observability Grid Rings (Subtle) -->
  <circle cx="64" cy="64" r="42" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="64" cy="64" r="28" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Radar Sweep Aperture Arc -->
  <path d="M 64 22 A 42 42 0 0 1 106 64" fill="none" stroke="url(#brandCyan)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- The Interlocking Cross & Watch Symbol -->
  <!-- Top / North Node -->
  <path d="M 57 26 C 57 23.79 58.79 22 61 22 L 67 22 C 69.21 22 71 23.79 71 26 L 71 45 C 71 47 69 49 67 49 L 61 49 C 59 49 57 47 57 45 Z" fill="url(#brandCyan)" />

  <!-- Bottom / South Node -->
  <path d="M 57 83 C 57 81 59 79 61 79 L 67 79 C 69 79 71 81 71 83 L 71 102 C 71 104.21 69.21 106 67 106 L 61 106 C 58.79 106 57 104.21 57 102 Z" fill="url(#brandBlue)" />

  <!-- Left / West Node (extends as a stylized C arc) -->
  <path d="M 26 57 C 23.79 57 22 58.79 22 61 L 22 67 C 22 69.21 23.79 71 26 71 L 45 71 C 47 71 49 69 49 67 L 49 61 C 49 59 47 57 45 57 Z" fill="url(#brandCyan)" />

  <!-- Right / East Node -->
  <path d="M 83 57 C 81 57 79 59 79 61 L 79 67 C 79 69 81 71 83 71 L 102 71 C 104.21 71 106 69.21 106 67 L 106 61 C 106 58.79 104.21 57 102 57 Z" fill="url(#brandBlue)" />

  <!-- Center Pulse / Iris Sensor (Watch Core) -->
  <circle cx="64" cy="64" r="16" fill="url(#centerGlow)" />
  <circle cx="64" cy="64" r="8" fill="#0f172a" stroke="url(#brandCyan)" stroke-width="2.5" />
  <circle cx="64" cy="64" r="3.5" fill="#38bdf8" />

  <!-- Dynamic Corner Focus Brackets (Watch / Telemetry frame) -->
  <path d="M 40 32 L 32 32 L 32 40" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
  <path d="M 88 32 L 96 32 L 96 40" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
  <path d="M 40 96 L 32 96 L 32 88" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
  <path d="M 88 96 L 96 96 L 96 88" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
</svg>
