<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="brandCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textWatcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- ICON MARK (Left, 64x64 at x=8, y=8) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#logoBgGrad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Radar ring -->
    <circle cx="32" cy="32" r="22" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="32" cy="32" r="14" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1" />
    
    <!-- Radar arc -->
    <path d="M 32 10 A 22 22 0 0 1 54 32" fill="none" stroke="url(#brandCyan)" stroke-width="2" stroke-linecap="round" />

    <!-- Cross arms -->
    <rect x="29" y="11" width="6" height="12" rx="2" fill="url(#brandCyan)" />
    <rect x="29" y="41" width="6" height="12" rx="2" fill="url(#brandBlue)" />
    <rect x="11" y="29" width="12" height="6" rx="2" fill="url(#brandCyan)" />
    <rect x="41" y="29" width="12" height="6" rx="2" fill="url(#brandBlue)" />

    <!-- Center Pulse -->
    <circle cx="32" cy="32" r="8" fill="url(#centerGlow)" />
    <circle cx="32" cy="32" r="4.5" fill="#0f172a" stroke="url(#brandCyan)" stroke-width="1.5" />
    <circle cx="32" cy="32" r="2" fill="#38bdf8" />
  </g>

  <!-- TYPOGRAPHY (Right) -->
  <g transform="translate(88, 48)">
    <!-- 'Cross' in solid dark/primary -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.03em" fill="#09090b">
      Cross<tspan fill="url(#textWatcGrad)">watc</tspan>
    </text>
  </g>

  <!-- Tagline / Subtitle -->
  <g transform="translate(90, 65)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="0.08em" text-transform="uppercase" fill="#71717a">
      GitOps Lifecycle Platform
    </text>
  </g>
</svg>
