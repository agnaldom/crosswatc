services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crosswatc
      POSTGRES_PASSWORD: crosswatc
      POSTGRES_DB: crosswatc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosswatc"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
