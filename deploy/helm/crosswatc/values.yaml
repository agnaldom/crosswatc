image:
  registry: ghcr.io/agnaldom
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

env: production   # CROSSWATC_ENV

api:
  replicas: 2
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 256Mi } }

worker:
  # Leader election on Lease crosswatc-worker (spec §35.2): only the leader runs informers,
  # polling and the reconciler; the other replica is a hot standby.
  replicas: 2
  leaderElection:
    enabled: true
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s
  informers:
    enabled: true
    events: true             # core/v1 Events (triggers refresh of the involved Claim)
  resyncInterval: 5m
  stuckTimeout: 30m
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }

web:
  replicas: 2
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }

database:
  # Secret with key DATABASE_URL (postgres://...).
  existingSecret: crosswatc-db

auth:
  mode: oidc                 # oidc | dev (dev is refused when env=production)
  oidcIssuer: ""
  oidcAudience: crosswatc
  squadGroupPrefix: squad-
  sreGroup: platform-sre

github:
  enabled: false
  apiURL: https://api.github.com
  appID: ""
  installationID: ""
  baseBranch: main          # Pull Requests for changes target this branch
  # Secret with key private-key.pem
  existingSecret: crosswatc-github-app

backstage:
  url: ""
  # Secret with key token (optional)
  existingSecret: ""

argocd:
  namespace: argocd

webhooks:
  # Secret with keys github-webhook-secret (GitHub App webhook secret, X-Hub-Signature-256) and/or
  # argocd-webhook-token (bearer token of the argocd-notifications webhook service). A missing key
  # disables that endpoint. When set, the ingress routes /webhooks to the API (spec §35.1).
  existingSecret: ""

rbac:
  # API groups of platform Claims/XRs (from your XRDs) and provider Managed Resources.
  # Kubernetes RBAC has no wildcard per group suffix, so list them explicitly.
  platformApiGroups: []      # e.g. [database.crosswatc.io, compute.crosswatc.io]
  providerApiGroups: []      # e.g. [dbforpostgresql.azure.upbound.io, network.azure.upbound.io]
  # Read every API group instead of the lists above (convenient for pilots; broader than needed).
  readAllGroups: false
  # Needed to check connection Secret existence (get) and to watch Secret metadata (list/watch, informer).
  # The code only uses the metadata API and never reads values, but RBAC cannot restrict verbs to metadata.
  secretMetadata: true

ingress:
  enabled: false
  className: ""
  host: crosswatc.example.com
  tls: []
