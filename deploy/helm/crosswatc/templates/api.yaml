apiVersion: apps/v1
kind: Deployment
metadata:
  name: crosswatc-api
  labels: {{- include "crosswatc.labels" . | nindent 4 }}
    app.kubernetes.io/name: crosswatc-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: crosswatc-api }
  template:
    metadata:
      labels: {{- include "crosswatc.labels" . | nindent 8 }}
        app.kubernetes.io/name: crosswatc-api
    spec:
      serviceAccountName: crosswatc
      containers:
        - name: api
          image: {{ include "crosswatc.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            {{- include "crosswatc.commonEnv" . | nindent 12 }}
            - { name: CROSSWATC_AUTH_MODE, value: {{ .Values.auth.mode | quote }} }
            - { name: CROSSWATC_OIDC_ISSUER, value: {{ .Values.auth.oidcIssuer | quote }} }
            - { name: CROSSWATC_OIDC_AUDIENCE, value: {{ .Values.auth.oidcAudience | quote }} }
            - { name: CROSSWATC_SQUAD_GROUP_PREFIX, value: {{ .Values.auth.squadGroupPrefix | quote }} }
            - { name: CROSSWATC_SRE_GROUP, value: {{ .Values.auth.sreGroup | quote }} }
            {{- with .Values.webhooks.existingSecret }}
            - name: CROSSWATC_GITHUB_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: {{ . }}, key: github-webhook-secret, optional: true } }
            - name: CROSSWATC_ARGOCD_WEBHOOK_TOKEN
              valueFrom: { secretKeyRef: { name: {{ . }}, key: argocd-webhook-token, optional: true } }
            {{- end }}
            {{- if .Values.github.enabled }}
            - { name: CROSSWATC_GITHUB_API_URL, value: {{ .Values.github.apiURL | quote }} }
            - { name: CROSSWATC_GITHUB_APP_ID, value: {{ .Values.github.appID | quote }} }
            - { name: CROSSWATC_GITHUB_INSTALLATION_ID, value: {{ .Values.github.installationID | quote }} }
            - { name: CROSSWATC_GITHUB_PRIVATE_KEY_PATH, value: /var/run/secrets/github/private-key.pem }
            - { name: CROSSWATC_GITOPS_BASE_BRANCH, value: {{ .Values.github.baseBranch | quote }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "crosswatc.securityContext" . | nindent 10 }}
          {{- if .Values.github.enabled }}
          volumeMounts:
            - { name: github-app, mountPath: /var/run/secrets/github, readOnly: true }
          {{- end }}
      {{- if .Values.github.enabled }}
      volumes:
        - name: github-app
          secret: { secretName: {{ .Values.github.existingSecret }} }
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: crosswatc-api
  labels: {{- include "crosswatc.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: crosswatc-api }
  ports: [{ name: http, port: 80, targetPort: http }]
