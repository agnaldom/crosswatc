{{- if .Values.observability.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: crosswatc-dashboard
  labels:
    {{- include "crosswatc.labels" . | nindent 4 }}
    {{- with .Values.observability.grafanaDashboard.labels }}{{ toYaml . | nindent 4 }}{{ end }}
data:
  crosswatc.json: |-
{{ .Files.Get "dashboards/crosswatc.json" | indent 4 }}
{{- end }}
